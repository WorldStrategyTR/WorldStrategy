S={v:6,me:{name:nm,em,c,r:c*3,lv:1,xp:0,en:150,gold:10,usd:1000,av:'',bio:'',jd:Date.now(),adm,lastPay:0,lastE:Date.now(),pow:1,edu:1,eco:1,trs:{},nc:0,fl:null},mods:[],pay:{m:300,a:600},parties:[],ach:{},st:{work:0,hit:0,cap:0,art:0,buy:0},news:[],nt:[],el:{},pres:{},min:{},own,def:RG.map(r=>300+r.pop),vote:{},fund:0,wars:[],sanc:{},rep:[],wid:0,tk:[],chat:{},dm:{},blk:[]};

function elect(c){const e=S.el[c];if((e&&e.open)||S.pres[c])return;const ps=S.parties.filter(p=>p.c==c);if(!ps.length)return;S.el[c]={open:1,end:Date.now()+12e4,votes:{}};notify(`🗳 ${CN[c].n} seçimi başladı! 2 dakikan var, oy kullan.`)}
function closeEl(c){const e=S.el[c];if(!e||!e.open||Date.now()<e.end)return;e.open=0;const v=e.votes,k=Object.keys(v);if(!k.length){notify(CN[c].n+' seçimi oy çıkmadığı için yenilendi.');S.el[c]=null;elect(c);return}const w=k.sort((a,b)=>v[b]-v[a])[0],p=S.parties.find(x=>x.id==w);S.pres[c]=p.ld;e.win=p.n;notify(`🏆 ${CN[c].n} seçimini ${p.n} kazandı. Yeni başkan: ${p.ld}`);save()}
const A={tab(t){tab=t;sel=null;MENU=0;draw()},

 rs(n){const e=$('#er');if(n==1){const em=$('#em').value.trim(),nm=$('#nm').value.trim().replace(/\s+/g,' ');if(!/^\S+@\S+\.\S+$/.test(em))return e.textContent='Geçerli bir e-posta girin (zorunlu)';if(!/^[\p{L}\p{N}_ ]{3,24}$/u.test(nm))return e.textContent='Ad 3-24 harf/rakam olmalı';const pw=$('#pw').value;if(pw.length<8)return e.textContent='Parola en az 8 karakter olmalı';if(pw!==$('#pw2').value)return e.textContent='Parolalar eşleşmiyor';RF.em=em;RF.nm=nm;RF.pw=pw;rs=2;draw()}else{if(RF.cy==null)return e.textContent='Bir vatan seçin';hp(RF.pw,RF.em.toLowerCase()).then(h=>{fresh(RF.nm,RF.em,RF.cy);S.me.ph=h;RF.pw='';UNL=1;try{sessionStorage.setItem('ws_u','1')}catch{}save();rs=1;draw()})}},

 pic(e){const f=e.target.files[0];if(!f)return;if(!/^image\//.test(f.type))return toast('Görsel dosyası seçin');const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const z=256,s=Math.min(im.width,im.height),cv=document.createElement('canvas');cv.width=cv.height=z;cv.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,z,z);URL.revokeObjectURL(u);S.me.av=cv.toDataURL('image/jpeg',.82);save();draw();toast('Fotoğraf güncellendi')};im.onerror=()=>{URL.revokeObjectURL(u);toast('Görsel açılamadı')};im.src=u},

 party(){const n=$('#pn').value.trim(),ab=$('#pa').value.trim().toUpperCase(),sl=$('#ps').value.trim(),pr=$('#pp').value.trim(),m=S.me;if(!n||!ab||!pr)return $('#er').textContent='Ad, kısaltma ve program zorunlu';if(myP())return $('#er').textContent='Zaten bir partidesin';if(S.parties.some(p=>p.c==m.c&&(p.n.toLowerCase()==n.toLowerCase()||p.ab==ab)))return $('#er').textContent='Bu ülkede aynı ad/kısaltma var';if(m.usd<500)return $('#er').textContent='Kuruluş ücreti 500 para';m.usd-=500;S.parties.push({id:Date.now(),n,ab,sl,pr,c:m.c,ld:m.name,mem:[m.name],t:Date.now()});notify(`🚩 ${n} partisini kurdun.`);xp(50);elect(m.c);save();draw()},

function vMap(){const m=S.me,w=MW/mz,h=MH/mz,x=Math.min(MW-w,Math.max(0,mc[0]-w/2)),y=Math.min(MH-h,Math.max(0,mc[1]-h/2)),cur=RG[m.r];return`<div class="card"><button class="btn" onclick="A.zoom(1.5)">＋</button><button class="btn" onclick="A.zoom(1/1.5)">－</button><button class="btn" onclick="A.pan(-1,0)">←</button><button class="btn" onclick="A.pan(1,0)">→</button><button class="btn" onclick="A.pan(0,-1)">↑</button><button class="btn" onclick="A.pan(0,1)">↓</button><svg viewBox="${x} ${y} ${w} ${h}" style="height:${sel!=null?'40vh':'58vh'}">${RG.map(r=>`<polygon class="reg" onclick="A.sel(${r.id})" points="${r.pts.join(' ')}" fill="${CN[S.own[r.id]].col}" fill-opacity="${sel==r.id?1:.8}" stroke="${sel==r.id?'#fff':'rgba(0,0,0,.45)'}" stroke-width="${sel==r.id?3:.8}"/>`).join('')}${CN.map((c,i)=>`<polygon points="${CO[i]}" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="2.2" style="pointer-events:none"/>`).join('')}${RG.map(r=>`<circle cx="${r.cen[0]}" cy="${r.cen[1]+5}" r="${r.k?2.2:3.4}" fill="#fff" style="pointer-events:none"/>${r.k?'':`<text x="${r.cen[0]}" y="${r.cen[1]-3}" text-anchor="middle" font-size="11" style="pointer-events:none">${CN[r.c].f}</text>`}${mz>=1.7?`<text x="${r.cen[0]}" y="${r.cen[1]+17}" text-anchor="middle" fill="#fff" font-size="9" style="pointer-events:none">${esc(r.city)}</text>`:''}`).join('')}<text x="${cur.cen[0]}" y="${cur.cen[1]-12}" text-anchor="middle" font-size="15">📍</text></svg><p class="m">18 ülke · 54 şehir. Bir bölgeye dokun.</p></div>${vSheet()}<div style="height:${sel!=null?'55vh':'0'}"></div>`}
function vSheet(){if(sel==null)return'';const s=RG[sel],m=S.me,ow=S.own[sel],here=m.r==sel,tabs=[['gen','Genel'],['city','Şehir'],['sya','Siyaset'],['sav','Savaş'],['sey','Seyahat']];const B={gen:`<p class="m">Savunma ${S.def[sel]}</p><div class="bar"><i style="width:${Math.min(100,S.def[sel]/(300+s.pop)*100)}%"></i></div><p class="m">Orijinal ülke: ${CN[s.c].f} ${CN[s.c].n}${s.k==0?' · ★ başkent':''} · Kaynak: ${s.res}</p>`,city:RG.filter(r=>r.c==s.c).map(r=>`<div class="row"><span>${r.k?'':'★ '}<b>${esc(r.city)}</b> <span class="m">${r.pop}.000 · ${r.res}</span></span><span>${CN[S.own[r.id]].f} <button class="btn" onclick="A.sel(${r.id})">Seç</button></span></div>`).join(''),sya:`<div class="row"><span>Gelir vergisi</span><b>2%</b></div><div class="row"><span>İhracat vergisi</span><b>2%</b></div><div class="row"><span>Sınırlar</span><b>Açık</b></div><p>Sahip: ${CN[ow].f} ${CN[ow].n}</p>`,sav:here&&ow!=m.c?`<p class="m">${fmt(dmgOf())} hasar / 10⚡ · tüm enerjin kullanılır</p>${(m.cd||0)>Date.now()?`<p class="m">😴 Dinlenme: <b class="cdt" data-at="${m.cd}">${cdf(m.cd)}</b></p>`:''}<button class="btn d" style="width:100%" onclick="A.atk()">⚔ VUR</button>`:here?'<p class="m">Bu bölge ülkenize ait.</p>':'<p class="m">Savaşmak için bölgede olmalısın.</p>',sey:`<p class="m">${m.fl?'Uçuştasın':here?'Buradasın':'Bilet: 20 para · '+FT(m.r,sel)/6e4+' dk'}</p><button class="btn p" ${here?'disabled':''} onclick="A.fly(${sel})">✈ Uç</button>`}[shT];return`<div class="sheet"><div style="display:flex;justify-content:space-between"><h2>${esc(s.city)} <span class="m">${CN[ow].f} ${CN[ow].n}</span></h2><button class="btn" onclick="A.sel(null)">✕</button></div><div style="display:flex;overflow-x:auto">${tabs.map(([k,n])=>`<button class="btn ${shT==k?'on':''}" onclick="shT='${k}';draw()">${n}</button>`).join('')}</div>${B}</div>`}
function vReg(){$('#nav').innerHTML='';$('#top').innerHTML=`<b>⚔ WORLD STRATEGY TR <small class="m">${VER}</small></b>`;let b;if(rs==1)b=`<h3>Kimliğin</h3><p class="m">E-posta (zorunlu)</p><input id="em" type="text" inputmode="email" autocapitalize="off" value="${esc(RF.em||'')}" placeholder="sen@ornek.com"><p class="m">Vatandaş adı</p><input id="nm" value="${esc(RF.nm||(localStorage.getItem('ws_owner')?'':'World Strategy'))}" placeholder="Adın"><p class="m">Parola (en az 8 karakter)</p><input id="pw" type="password" autocomplete="new-password"><p class="m">Parola (tekrar)</p><input id="pw2" type="password" autocomplete="new-password"><div class="err" id="er"></div><button class="btn p" style="width:100%" onclick="A.rs(1)">DEVAM ET</button>`;else b=`<h3>Vatanını seç</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px">${CN.map((c,i)=>`<button class="btn ${RF.cy==i?'on':''}" onclick="A.cy(${i})">${c.f} ${c.n}</button>`).join('')}</div>${RF.cy!=null?`<p class="m">Şehirler: ${CT[RF.cy].join(', ')}</p>`:''}<div class="err" id="er"></div><button class="btn p" style="width:100%" onclick="A.rs(2)">MÜHRÜ BAS VE BAŞLA</button><button class="btn" onclick="rs=1;draw()">Geri</button>`;$('#v').innerHTML=`<div class="card" style="max-width:420px;margin:12px auto"><h2 style="text-align:center;font-size:44px">⚔</h2><p class="m" style="text-align:center">Üç kısa adım, sonra dünya sana bir vatan verir.</p>${b}</div>`}

let KEEP=0;function dk(){KEEP=1;try{draw()}finally{KEEP=0}}
function settle(){if(!S)return 0;const m=S.me,t=Date.now();let ch=0;
if(m.fl&&t>=m.fl.at){m.r=m.fl.to;m.fl=null;notify('✈ Vardın: '+RG[m.r].city);ch=1}
for(const k in m.trs){const r=m.trs[k];if(t>=r.at){m[k]=r.lv;delete m.trs[k];notify('✔ '+SK[k][0]+' Sv '+r.lv);ch=1}}
if(m.en>=MX(m.lv))m.lastE=t;else{const n=Math.floor((t-m.lastE)/12e4);if(n>0){m.en=Math.min(MX(m.lv),m.en+n);m.lastE+=n*12e4;ch=1}}
if(ch)save();return ch}
function draw(){if(!S){vReg();return}settle();const KP={};if(KEEP&&document.getElementById)['cm','dmx','ht','ax','at','bio','rn','mu','mt','dq','rnote'].forEach(i=>{const e=document.getElementById(i);if(e&&e.value)KP[i]=e.value});hdr();const sn=S.sanc[S.me.name.toLowerCase()]||{};if((sn.bn||0)>Date.now()){$('#v').innerHTML='<div class="card"><h3>⛔ Hesap askıda</h3><p>Moderatör kararıyla hesabınız askıya alındı.</p></div>';return}if(MENU){$('#v').innerHTML=vMenu();return}$('#v').innerHTML={home:vHome,prof:vProf,harita:vMap,party:vParty,sec:vSec,news:vNews,ach:vAch,bil:vBil,pre:vPre,adm:vAdm,war:vWar,modp:vModp,chat:vChat,dm:vDM,help:vHelp,book:vBook}[tab]()+(REP?vRep():'');if(KEEP)Object.keys(KP).forEach(i=>{const e=document.getElementById(i);if(e)e.value=KP[i]});tick()}
const DONE=new Set();let RD=0;
function tick(){if(!S)return;const c=S.me.c,e=S.el[c];if(e&&e.open&&Date.now()>=e.end&&tab!='sec'){closeEl(c)}const cd=$('#cd');if(cd&&e)cd.textContent=Math.max(0,Math.ceil((e.end-Date.now())/1e3))+' sn';if(document.querySelectorAll)document.querySelectorAll('.cdt').forEach(x=>{const s=Math.max(0,Math.ceil((+x.dataset.at-Date.now())/1000));x.textContent=(s/60|0)+':'+String(s%60).padStart(2,'0');if(!s){const k=x.dataset.at;if(!DONE.has(k)){if(DONE.size>300)DONE.clear();DONE.add(k);if(!RD)RD=setTimeout(()=>{RD=0;dk()},30)}}})}
load();if(S){S.parties.forEach(p=>elect(p.c));S.me.en=Math.min(MX(S.me.lv),S.me.en+Math.floor((Date.now()-S.me.lastE)/12e4));S.me.lastE=Date.now();Object.keys(S.el).forEach(c=>S.el[c]&&closeEl(+c))}draw();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S){settle();dk()}});setInterval(()=>{if(S){if(settle())dk();if(++TC%60==0){warTick();if(tab=='war')dk()}tick()}},1000);
