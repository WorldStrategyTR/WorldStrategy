<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Strategy Yama Aracı</title><style>body{margin:0;background:#04070c;color:#eef0f6;font:16px system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}.c{max-width:420px;width:100%;background:#0b1119;border:1px solid #5a4614;border-radius:14px;padding:20px;text-align:center}.b{display:block;width:100%;background:#f0b429;color:#140e02;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:15px;margin-top:14px}.m{color:#8d97ad;font-size:13px}#s{margin-top:12px;min-height:20px}</style></head><body><div class="c"><h2>⚔ World Strategy</h2><p class="m">Eski oyun HTML dosyanı seç. Doğrulamalı kayıt, giriş sayfası ve Basın eklenmiş yeni dosya otomatik inecek.</p><input id="f" type="file" accept=".html,text/html" hidden><button class="b" onclick="document.getElementById('f').click()">Oyun dosyasını seç</button><div id="s" class="m"></div></div><script>
const PATCH="/* ===== WORLD STRATEGY YAMASI: doğrulamalı kayıt + giriş sayfası + Basın =====\n   Bu bloğu oyun dosyasında şu satırın HEMEN ÜSTÜNE yapıştır:\n   load();if(S){S.parties.forEach(p=>elect(p.c)) ...\n   (yani en alttaki  load();  satırından önce) */\n\n/* --- Kayıt: 1) bilgiler  2) e-posta doğrulama  3) vatan seçimi --- */\nA.rs=function(n){\n  const e=$('#er');\n  if(n==1){\n    const em=$('#em').value.trim(),nm=$('#nm').value.trim().replace(/\\s+/g,' '),pw=$('#pw').value;\n    if(!/^\\S+@\\S+\\.\\S+$/.test(em))return e.textContent='Geçerli bir e-posta girin (zorunlu)';\n    if(!/^[\\p{L}\\p{N}_ ]{3,24}$/u.test(nm))return e.textContent='Ad 3-24 harf/rakam olmalı';\n    if(pw.length<8)return e.textContent='Parola en az 8 karakter olmalı';\n    if(pw!==$('#pw2').value)return e.textContent='Parolalar eşleşmiyor';\n    RF.em=em;RF.nm=nm;RF.pw=pw;RF.code=String(100000+Math.floor(Math.random()*900000));RF.tries=0;\n    rs=2;draw();\n  }else if(n==2){\n    const v=($('#vc').value||'').trim();\n    if(RF.tries>=5)return e.textContent='Çok fazla deneme. Yeni kod isteyin.';\n    if(v!==RF.code){RF.tries++;return e.textContent='Kod yanlış';}\n    rs=3;draw();\n  }else{\n    if(RF.cy==null)return e.textContent='Bir vatan seçin';\n    hp(RF.pw,RF.em.toLowerCase()).then(h=>{\n      fresh(RF.nm,RF.em,RF.cy);S.me.ph=h;S.me.ver=1;RF.pw='';RF.code='';\n      UNL=1;try{sessionStorage.setItem('ws_u','1')}catch{}\n      save();rs=1;draw();\n    });\n  }\n};\nA.resend=function(){RF.code=String(100000+Math.floor(Math.random()*900000));RF.tries=0;draw();toast('Yeni kod gönderildi')};\n\nvReg=function(){\n  $('#nav').innerHTML='';\n  $('#top').innerHTML=`<b>⚔ WORLD STRATEGY <small class=\"m\">${VER}<\/small><\/b>`;\n  let b;\n  if(rs==1){\n    b=`<h3>Kayıt ol<\/h3><p class=\"m\">E-posta (zorunlu)<\/p><input id=\"em\" type=\"text\" inputmode=\"email\" autocapitalize=\"off\" value=\"${esc(RF.em||'')}\" placeholder=\"sen@ornek.com\"><p class=\"m\">Vatandaş adı<\/p><input id=\"nm\" value=\"${esc(RF.nm||'')}\" placeholder=\"Adın\"><p class=\"m\">Parola (en az 8 karakter)<\/p><input id=\"pw\" type=\"password\" autocomplete=\"new-password\"><p class=\"m\">Parola (tekrar)<\/p><input id=\"pw2\" type=\"password\" autocomplete=\"new-password\"><div class=\"err\" id=\"er\"><\/div><button class=\"btn p\" style=\"width:100%\" onclick=\"A.rs(1)\">DEVAM ET<\/button>`;\n  }else if(rs==2){\n    b=`<h3>E-posta doğrulama<\/h3><p class=\"m\">${esc(RF.em)} adresine 6 haneli doğrulama kodu gönderildi. Kodu aşağıya yaz.<\/p><div style=\"border:1px dashed var(--a);border-radius:12px;padding:10px;text-align:center;margin:8px 0\"><div class=\"m\">Demo modu: e-posta sunucusu yok, kodun bu ekranda görünür<\/div><div class=\"big\" style=\"letter-spacing:8px;color:var(--a)\">${RF.code}<\/div><\/div><input id=\"vc\" inputmode=\"numeric\" maxlength=\"6\" placeholder=\"6 haneli kod\" style=\"text-align:center;letter-spacing:6px;font-size:20px\"><div class=\"err\" id=\"er\"><\/div><button class=\"btn p\" style=\"width:100%\" onclick=\"A.rs(2)\">DOĞRULA<\/button><button class=\"btn\" onclick=\"A.resend()\">Kodu yeniden gönder<\/button><button class=\"btn\" onclick=\"rs=1;draw()\">Geri<\/button>`;\n  }else{\n    b=`<h3>Vatanını seç<\/h3><p class=\"m\" style=\"color:var(--ok)\">✔ E-posta doğrulandı<\/p><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:4px\">${CN.map((c,i)=>`<button class=\"btn ${RF.cy==i?'on':''}\" onclick=\"A.cy(${i})\">${c.f} ${c.n}<\/button>`).join('')}<\/div>${RF.cy!=null?`<p class=\"m\">Şehirler: ${CT[RF.cy].join(', ')}<\/p>`:''}<div class=\"err\" id=\"er\"><\/div><button class=\"btn p\" style=\"width:100%\" onclick=\"A.rs(3)\">MÜHRÜ BAS VE BAŞLA<\/button>`;\n  }\n  $('#v').innerHTML=`<div class=\"card\" style=\"max-width:420px;margin:12px auto\"><h2 style=\"text-align:center;font-size:44px\">⚔<\/h2><p class=\"m\" style=\"text-align:center\">Adım ${rs}/3<\/p>${b}<\/div>`;\n};\n\n/* --- Giriş sayfası (kayıtlı hesap için e-posta + parola) --- */\nvLock=function(){\n  $('#nav').innerHTML='';\n  $('#top').innerHTML=`<b>⚔ WORLD STRATEGY <small class=\"m\">${VER}<\/small><\/b>`;\n  $('#v').innerHTML=`<div class=\"card\" style=\"max-width:420px;margin:12px auto\"><h2 style=\"text-align:center;font-size:44px\">⚔<\/h2><h3>Giriş yap<\/h3><p class=\"m\">E-posta<\/p><input id=\"lem\" type=\"text\" inputmode=\"email\" autocapitalize=\"off\" placeholder=\"sen@ornek.com\" value=\"${esc(S.me.em)}\"><p class=\"m\">Parola<\/p><input id=\"lpw\" type=\"password\" autocomplete=\"current-password\"><div class=\"err\" id=\"er\"><\/div><button class=\"btn p\" style=\"width:100%\" onclick=\"A.unlock()\">GİRİŞ YAP<\/button><button class=\"btn d\" onclick=\"A.reset()\">Hesabı sil / yeni kayıt<\/button><\/div>`;\n};\nA.unlock=async function(){\n  const em=($('#lem').value||'').trim().toLowerCase();\n  if(em!==S.me.em.toLowerCase())return $('#er').textContent='E-posta kayıtlı değil';\n  const h=await hp($('#lpw').value,em);\n  if(h!==S.me.ph)return $('#er').textContent='Parola yanlış';\n  UNL=1;try{sessionStorage.setItem('ws_u','1')}catch{}\n  draw();\n};\nA.logout=function(){UNL=0;MENU=0;try{sessionStorage.removeItem('ws_u')}catch{}draw()};\n\n/* giriş yapılmadan oyun açılmasın */\n{const _d=draw;draw=function(){if(S&&!UNL){vLock();return}_d()}}\n\n/* menüye çıkış butonu */\n{const _m=vMenu;vMenu=function(){return _m().replace(/<\\/div>$/,'<div class=\"mh\">HESAP<\/div><button class=\"mi\" onclick=\"A.logout()\"><span style=\"font-size:20px\">🚪<\/span>Çıkış yap<\/button><\/div>')}}\n\n/* --- BASIN: üst sekme çubuğu + alt çubuk --- */\n{const _h=hdr;hdr=function(){\n  _h();\n  const T=[['home','🏠 Ana'],['press','📰 Basın'],['harita','🗺 Harita'],['war','⚔ Savaş'],['chat','💬 Sohbet'],['party','🚩 Parti']];\n  $('#nav').innerHTML=T.map(([k,n])=>`<button class=\"btn ${tab==k||(k=='press'&&tab=='news')?'on':''}\" onclick=\"A.tab('${k}')\">${n}<\/button>`).join('');\n}}\n";
const s=document.getElementById('s');
document.getElementById('f').onchange=async e=>{const f=e.target.files[0];if(!f)return;let t=await f.text();
if(t.includes('A.logout=function')){s.textContent='Bu dosyaya yama zaten uygulanmış.';return}
const mk='load();if(S){S.parties.forEach';let i=t.indexOf(mk),o;
if(i>=0)o=t.slice(0,i)+PATCH+'\n'+t.slice(i);
else{const j=t.lastIndexOf('<'+'/script>');if(j<0){s.textContent='Geçerli bir oyun dosyası değil.';return}o=t.slice(0,j)+PATCH+'\ndraw();\n'+t.slice(j)}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([o],{type:'text/html'}));a.download='world-strategy-yamali.html';document.body.appendChild(a);a.click();a.remove();s.textContent='✔ world-strategy-yamali.html indirildi.'};
</script></body></html>
